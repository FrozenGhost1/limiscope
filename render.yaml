services:
  - type: web
    name: limiscope-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://frozenghost1.github.io
      - key: CACHE_TTL_SECONDS
        value: 60
