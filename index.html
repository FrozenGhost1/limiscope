<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LimiScope — Home</title><style>:root{color-scheme:dark;--bg:#0c0914;--panel:#171222;--line:#332747;--muted:#a69ab8;--text:#f6f1ff;--p:#9868ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -15%,#35204f,transparent 48%),var(--bg);color:var(--text);font:14px system-ui,sans-serif}.shell{max-width:1400px;margin:auto;padding:0 25px}.top{height:72px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px}.mark{background:linear-gradient(135deg,#bd9bff,#6939bd);width:32px;height:32px;border-radius:10px;display:grid;place-items:center}.mark:after{content:'L';font-weight:900}.btn,.nav a{border:1px solid var(--line);background:#211a30;color:#eee7ff;border-radius:9px;padding:10px 13px;cursor:pointer;text-decoration:none}.btn:hover,.nav a:hover,.nav a.active{border-color:#9466e5;background:#2a2040}.primary{background:linear-gradient(135deg,#9563e8,#6741b8);border-color:#a17be5;color:white;font-weight:700}.layout{display:grid;grid-template-columns:205px 1fr;gap:24px;padding:24px 0}.side{position:sticky;top:15px;align-self:start}.nav{display:grid;gap:7px}.nav a{background:transparent;border-color:transparent;color:#bdb2cd}.nav a.active{color:white;border-color:#44335c;box-shadow:inset 3px 0 var(--p)}.main{min-width:0}.view{display:none}.view.active{display:block}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#b18af8;font-weight:800}.heading{font-size:29px;margin:8px 0}.sub,.hint{color:var(--muted);line-height:1.6}.sub{margin:0 0 22px}.hero,.panel,.tile,.stat,.item{background:linear-gradient(145deg,#1b1528,#130f1d);border:1px solid var(--line);border-radius:14px}.hero{padding:25px;margin-bottom:15px}.hero h2{font-size:25px}.hero p,.tile p{color:#b8acc9;line-height:1.6}.row{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{padding:17px;color:inherit;text-decoration:none}.tile:hover,.item:hover{border-color:#8f66d7}.tile b{display:block;margin:10px 0 5px}.tile p{font-size:12px;margin:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.field{background:#100c18;color:white;border:1px solid #403052;border-radius:9px;padding:11px;min-width:0}.search{flex:1;min-width:190px}.catalog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.item{padding:10px;min-width:0}.thumb{height:135px;background:#0e0a15;border-radius:9px;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}.itemname{display:block;color:white;text-decoration:none;font-weight:700;margin:9px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);line-height:1.7}.itemrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.small{font-size:11px;padding:6px 9px}.empty{grid-column:1/-1;border:1px dashed #4a385e;border-radius:12px;padding:26px;text-align:center;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{padding:14px}.stat span{color:var(--muted);font-size:12px}.stat b{display:block;font-size:21px;margin-top:6px}.facts{border:1px solid var(--line);border-radius:12px;overflow:hidden}.fact{display:flex;justify-content:space-between;padding:11px;border-bottom:1px solid var(--line);gap:10px}.fact span{color:#c3b8d2;text-align:right}.detail{display:grid;grid-template-columns:.8fr 1.2fr;gap:15px}.preview{min-height:280px;background:#100c18;border:1px solid var(--line);border-radius:13px;display:grid;place-items:center}.preview img{max-width:100%;max-height:350px;object-fit:contain}.notice{padding:12px;border:1px solid #654b2b;background:#261d12;color:#e4c78c;border-radius:10px}.modal{display:none;position:fixed;inset:0;background:#05030bdd;place-items:center;padding:15px;z-index:5}.modal.open{display:grid}.modalbox{background:#191323;border:1px solid #49365f;border-radius:15px;padding:20px;width:min(450px,100%)}.modalbox input{width:100%;margin:10px 0}.foot{padding:18px 0;color:#746a82;font-size:11px;border-top:1px solid var(--line)}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static}.nav{display:flex;overflow:auto}.nav a{white-space:nowrap}.catalog{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.shell{padding:0 13px}.heading{font-size:25px}.grid{grid-template-columns:repeat(2,1fr)}.catalog{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.thumb{height:110px}}</style></head><body><div class="site"><header class="masthead"><div class="brand">ROBLOX</div><div class="tagline">Think. Create.<br><small>LimiScope Limited Catalog</small></div><a href="catalog.html"><button class="play">CATALOG</button></a></header><nav class="nav"><a href="index.html">Home</a><a href="catalog.html">Catalog</a></nav><main class="main home-action"><h1>ROBLOX Virtual Playworld</h1><p>Browse Roblox-created limited items.</p><a href="catalog.html"><button class="play">OPEN CATALOG</button></a></main><footer class="footer">LimiScope is an independent project and is not affiliated with Roblox.</footer></div><script>const API_BASE='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>n==null?'Not available':Number(n).toLocaleString('en-US');async function api(path){if(!API_BASE)throw Error('Live catalog service is not deployed.');const r=await fetch(API_BASE+path);if(!r.ok)throw Error('Request failed ('+r.status+').');return r.json()}</script></body></html>
